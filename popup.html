<!doctype html><html lang="ko"><meta charset="utf-8"><title>ChatGPT AutoPilot</title><style>body{width:310px;padding:16px;font:14px system-ui}textarea,input{box-sizing:border-box;width:100%;margin:8px 0;padding:8px}button{padding:9px;margin-right:8px}</style><h2>ChatGPT AutoPilot</h2><p id="status">대기 중</p><label>후속 프롬프트<textarea id="prompt" rows="5">이전 작업 결과와 Git 상태를 확인하고 다음 미완료 TASK 하나를 구현하고 테스트하세요. 문제가 있으면 중단하고 보고하세요.</textarea></label><label>최대 전송 횟수<input id="limit" type="number" min="1" max="30" value="3"></label><button id="start">시작</button><button id="stop">중지</button><p>ChatGPT 대화에서 시작하면 첫 프롬프트를 전송합니다. 실제 웹 UI 검증 전 프로토타입입니다.</p><script src="src/popup.js"></script>
